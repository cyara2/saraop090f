name: RDP

on:
  workflow_dispatch:

permissions: write-all

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Policy Bypass
        run: |
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item C:\secpol.cfg -Force

          $username = "rdp"
          $password = "rdp123456"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if (-not $user) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          } else {
              Set-LocalUser -Name $username -Password $securePass
              Enable-LocalUser -Name $username
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          
          echo "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV

      - name: Install Browser Extensions
        run: |
          # Chrome Extensions Configuration
          $chromePath = "HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist"
          if (-not (Test-Path $chromePath)) {
              New-Item -Path $chromePath -Force | Out-Null
          }
          New-ItemProperty -Path $chromePath -Name "1" -Value "lfkgcfakbpblpflbjanpoaipofoodnen;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $chromePath -Name "2" -Value "majdfhpaihoncoakbjgbdhglocklcgno;https://clients2.google.com/service/update2/crx" -PropertyType String -Force | Out-Null
          
          # Edge Extensions Configuration
          $edgePath = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist"
          if (-not (Test-Path $edgePath)) {
              New-Item -Path $edgePath -Force | Out-Null
          }
          New-ItemProperty -Path $edgePath -Name "1" -Value "pciakllldcajllepkbbihkmfkikheffb;https://edge.microsoft.com/extensionwebstorebase/v1/crx" -PropertyType String -Force | Out-Null

          Write-Host "Chrome and Edge extensions configured successfully!"

      - name: Download, Extract, Install, UI Setup & Explicit Registry Values
        shell: pwsh
        run: |
          $desktopPath = "C:\Users\Public\Desktop"
          $rarPath = "$desktopPath\ahmad.rar"
          $extractPath = "$desktopPath\ahmad_extracted"
          
          $directUrl = "https://drive.usercontent.google.com/download?id=1cf_pdTQNsD8WmYiM53uUEJh4QGpNXAxa&export=download&authuser=0"
          
          Write-Host "Downloading file directly from Google Drive..."
          Invoke-WebRequest -Uri $directUrl -OutFile $rarPath
          
          Write-Host "Extracting archive using 7-Zip..."
          if (Test-Path $rarPath) {
              & "C:\Program Files\7-Zip\7z.exe" x $rarPath -o"$extractPath" -y
              Write-Host "Extracted successfully!"
          } else {
              Write-Error "Archive file not found!"
              exit 1
          }

          # 1. MacroRecorderSetup.exe انسٹال کرنا
          Write-Host "Installing MacroRecorderSetup.exe..."
          $installerPath = "$extractPath\MacroRecorderSetup.exe"
          if (Test-Path $installerPath) {
              Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/quiet", "/NORESTART" -Wait
              Write-Host "Macro Recorder Setup Installed Successfully!"
          } else {
              $macroSetup = Get-ChildItem -Path $extractPath -Filter "*Macro*Recorder*.exe" | Select-Object -First 1
              if ($macroSetup) {
                  Start-Process -FilePath $macroSetup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/quiet", "/NORESTART" -Wait
              }
          }

          # 2. میکرو ریکارڈر اوپن کر کے UI (Tabs) کے ذریعے رجسٹر پر کلک کرنا
          Write-Host "Opening Macro Recorder to trigger UI initialization..."
          $macroPath = "C:\Program Files (x86)\MacroRecorder\MacroRecorder.exe"
          if (-not (Test-Path $macroPath)) {
              $macroPath = "C:\Program Files\MacroRecorder\MacroRecorder.exe"
          }
          
          Start-Process $macroPath
          Start-Sleep -Seconds 6
          
          $wshell = New-Object -ComObject wscript.shell
          $wshell.AppActivate("Macro Recorder")
          Start-Sleep -Seconds 1
          
          # Tab 1 -> Pricing / Buy
          $wshell.SendKeys("{TAB}")
          Start-Sleep -Milliseconds 300
          
          # Tab 2 -> Username
          $wshell.SendKeys("{TAB}")
          Start-Sleep -Milliseconds 300
          $wshell.SendKeys("1")
          Start-Sleep -Milliseconds 300
          
          # Tab 3 -> Serial Number
          $wshell.SendKeys("{TAB}")
          Start-Sleep -Milliseconds 300
          $serialKey = "HGCNNGujba4SdhQELI56YkubWcJe4MMhOw6mrqdA3WdWKp63lGmQgQSw"
          $wshell.SendKeys($serialKey)
          Start-Sleep -Milliseconds 500
          
          # Tab 4 -> Register بٹن
          $wshell.SendKeys("{TAB}")
          Start-Sleep -Milliseconds 300
          
          # Register پر Enter پریس کرنا
          $wshell.SendKeys("{ENTER}")
          Start-Sleep -Seconds 2
          
          # اگر کوئی Success پاپ اپ آئے تو اسے ہٹانے کے لیے ایک اور Enter
          $wshell.SendKeys("{ENTER}")
          Start-Sleep -Seconds 1

          # 3. رجسٹری میں بالکل نئی String Value (REG_SZ) فائلز بنانا
          Write-Host "Creating New String Values (REG_SZ) in Registry..."
          $regPath = "HKCU:\SOFTWARE\Jitbit\Macro Recorder"
          
          if (-not (Test-Path $regPath)) {
              New-Item -Path $regPath -Force | Out-Null
          }
          
          # Email کے نام سے String Value (REG_SZ) بنانا
          New-ItemProperty -Path $regPath -Name "Email" -Value "1" -PropertyType String -Force | Out-Null
          
          # Code کے نام سے String Value (REG_SZ) بنانا
          New-ItemProperty -Path $regPath -Name "Code" -Value $serialKey -PropertyType String -Force | Out-Null
          
          Write-Host "New String Values explicitly created and Macro Recorder is permanently Registered!"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=ahmad --accept-routes
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: rdp"
          Write-Host "Password: rdp123456"
          Write-Host "==================`n"
          
          for ($i = 0; $i -lt 71; $i++) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
